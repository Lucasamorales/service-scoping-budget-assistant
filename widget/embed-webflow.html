<!--
  Acme Scoping Assistant — Webflow embed.

  Paste the whole of this into a Webflow Embed element on a page of its own.
  It reproduces the standalone page: navy filling the window, the assistant
  centred in it, nothing else.

  Three things worth knowing before editing it:

  * The background is set on html and body, not on a wrapper. A wrapper can
    only ever be as wide as the section Webflow puts it in, which is what left
    white down the sides and underneath. This is the one case where an embed
    should reach outside itself, because the request is precisely that the page
    stop being white.
  * !important is there to beat Webflow's own body styling, which is set from
    the Designer and would otherwise win. Only the background is touched — no
    fonts, no typography, nothing that could disturb another page.
  * Nothing here can reach the assistant itself. It is a shadow root, so its
    styling is sealed. That also means the page has to load the fonts: font
    loading is document-scoped, and without the <link> below the assistant
    silently falls back to Segoe UI while otherwise looking fine.

  For no white at all, give this page a blank Webflow layout — no nav, no
  footer. Anything else Webflow renders sits above or below this section and
  will show.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat+Brush&display=swap"
  rel="stylesheet">

<style>
  html,
  body {
    /* The wash sits at the top right exactly as it does on the standalone
       page. Painting it here rather than on the wrapper is what lets it run to
       the edges of the window instead of to the edges of a Webflow section. */
    background:
      radial-gradient(900px 420px at 85% -10%, rgba(107, 176, 224, 0.18), transparent 55%),
      #101A33 !important;
    margin: 0 !important;
  }

  .acme-q {
    display: grid;
    place-items: center;
    /* dvh first so mobile browser chrome does not leave a navy-less strip when
       the address bar collapses; vh is the fallback for anything older. */
    min-height: 100vh;
    min-height: 100dvh;
    padding: 40px 24px;
    box-sizing: border-box;
    font-family: "Archivo", "Segoe UI", system-ui, sans-serif;
  }

  .acme-q acme-chat {
    display: block;
    width: min(760px, 100%);
  }

  @media (max-width: 640px) {
    .acme-q {
      padding: 0;
      place-items: stretch;
    }
  }
</style>

<div class="acme-q">
  <acme-chat api-base="https://your-service-url.a.run.app"></acme-chat>
</div>

<!--
  Bump ?v= after any deploy that changes how the assistant looks. Browsers
  cache modules hard, and without it people keep being served the old bundle.
-->
<script type="module"
        src="https://your-service-url.a.run.app/widget/acme-chat.js?v=1"></script>
