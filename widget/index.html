<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Scoping Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f1a22;
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background:
          radial-gradient(900px 420px at 80% 0%, rgba(11, 110, 79, 0.35), transparent 60%),
          linear-gradient(160deg, #0f1a22 0%, #163042 55%, #0f1a22 100%);
      }
      .frame {
        width: min(720px, 100%);
      }
      acme-chat {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <acme-chat></acme-chat>
    </div>
    <script type="module" src="/widget/acme-chat.js"></script>
  </body>
</html>
