<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Scoping Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Caveat+Brush&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark light;
        --page-canvas: #101A33;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page-canvas);
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(107, 176, 224, 0.18), transparent 55%),
          var(--page-canvas);
        font-family: "Archivo", "Segoe UI", sans-serif;
      }
      .frame {
        width: min(760px, 100%);
      }
      acme-chat {
        width: 100%;
      }
      @media (max-width: 640px) {
        body {
          padding: 0;
          place-items: stretch;
        }
        .frame {
          width: 100%;
          min-height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <acme-chat></acme-chat>
    </div>
      <script type="module" src="/widget/acme-chat.js?v=20260819a"></script>
  </body>
</html>
