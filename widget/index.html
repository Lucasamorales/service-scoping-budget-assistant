<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme Scoping Assistant</title>
    <link rel="stylesheet" href="/widget/assets/fonts.css" />
    <style>
      :root {
        color-scheme: dark light;
        --page-canvas: #101A33;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--page-canvas);
      }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background:
          radial-gradient(900px 420px at 85% -10%, rgba(107, 176, 224, 0.18), transparent 55%),
          var(--page-canvas);
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      .frame {
        /* Room for the conversation and the service list side by side. The
           assistant centres itself inside this, so with the list closed the
           chat still sits at its usual 760 rather than drifting wide. */
        width: min(1140px, 100%);
      }
      acme-chat {
        width: 100%;
      }
      @media (max-width: 640px) {
        body {
          padding: 0;
          place-items: stretch;
        }
        .frame {
          width: 100%;
          min-height: 100dvh;
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <acme-chat></acme-chat>
    </div>
      <!-- Bump ?v= whenever the widget changes. The bundle URL is otherwise
           constant, so a browser that has loaded it once keeps its copy: this
           stayed at 20260819a through a month of widget changes, and a returning
           visitor could still be running August's bundle. -->
      <script type="module" src="/widget/acme-chat.js?v=20260915a"></script>
  </body>
</html>
