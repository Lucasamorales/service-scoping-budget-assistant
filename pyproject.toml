[project]
name = "acme-scoping-assistant"
version = "0.1.0"
description = "Scoping assistant and budget tracker for Acme branch marketing requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "structlog>=24.4",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    # Pure Python, no data files: stemming has to run inside the request, and
    # the hand-written suffix rules it replaced missed every verb whose gerund
    # the corpus uses as an item name.
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
# Split out so the catalog and retrieval layers stay importable without cloud
# credentials, which keeps unit tests and chunk previews runnable offline.
cloud = [
    "google-genai>=0.3",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.21",
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
]
# Only for scripts/capture_screenshots.py, which retakes the README's pictures.
# Kept out of dev because it pulls a driver bundle nobody needs to run the
# tests, and it drives the Chrome already on the machine rather than
# downloading its own.
docs = [
    "playwright>=1.48",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    # Reads back the PDF the request emails attach. The layout tests assert
    # what actually landed on each page — a pagination rule can only be checked
    # by looking at the pages it produced.
    "pypdfium2>=4.30",
    # Converts the brand woff2 files to the TrueType fpdf2 embeds. Build-time
    # only: the .ttf files are committed, so the service never needs it.
    "fonttools[woff]>=4.55",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "BLE"]
ignore = [
    "ANN401",
    # Curly apostrophes and en dashes are deliberate in user-facing copy: this
    # product writes to marketing staff, and "I'll" typed as a straight quote
    # looks like a bug in the widget. Flagging them trains people to mangle the
    # prose to satisfy the linter.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Google's client libraries and openpyxl ship no type information. Skipping
# them here rather than scattering inline ignores keeps `mypy app scripts`
# clean in both installs: with the `cloud` extra present the modules resolve
# to Any, and without it they are simply absent. Inline ignores could not do
# both — they were flagged as unused whenever the extra happened to be
# installed, which is why they kept drifting.
[[tool.mypy.overrides]]
module = [
    "google.*",
    "google_auth_httplib2.*",
    "googleapiclient.*",
    "httplib2.*",
    "openpyxl.*",
    "playwright.*",
    "pypdfium2.*",
    "snowballstemmer.*",
]
follow_imports = "skip"
ignore_missing_imports = true
