[project]
name = "acme-scoping-assistant"
version = "0.1.0"
description = "Scoping assistant and budget tracker for Acme branch marketing requests"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "structlog>=24.4",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
# Split out so the catalog and retrieval layers stay importable without cloud
# credentials, which keeps unit tests and chunk previews runnable offline.
cloud = [
    "google-genai>=0.3",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-secret-manager>=2.21",
    "google-api-python-client>=2.149",
    "google-auth>=2.35",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PTH", "BLE"]
ignore = [
    "ANN401",
    # Curly apostrophes and en dashes are deliberate in user-facing copy: this
    # product writes to marketing staff, and "I'll" typed as a straight quote
    # looks like a bug in the widget. Flagging them trains people to mangle the
    # prose to satisfy the linter.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Google's client libraries and openpyxl ship no type information. Skipping
# them here rather than scattering inline ignores keeps `mypy app scripts`
# clean in both installs: with the `cloud` extra present the modules resolve
# to Any, and without it they are simply absent. Inline ignores could not do
# both — they were flagged as unused whenever the extra happened to be
# installed, which is why they kept drifting.
[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "openpyxl.*"]
follow_imports = "skip"
ignore_missing_imports = true
